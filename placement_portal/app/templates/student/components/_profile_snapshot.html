<div class="card shadow-sm mb-4">

    <div class="card-header">
        <h5 class="mb-0">Student Profile</h5>
    </div>

    <div class="card-body">

        <div class="row mb-2">
            <div class="col-md-4 fw-bold">Name</div>
            <div class="col-md-8">{{ student.name }}</div>
        </div>

        <div class="row mb-2">
            <div class="col-md-4 fw-bold">Student ID</div>
            <div class="col-md-8">{{ student.student_id }}</div>
        </div>

        <div class="row mb-2">
            <div class="col-md-4 fw-bold">Branch</div>
            <div class="col-md-8">{{ student.branch }}</div>
        </div>

        <div class="row mb-2">
            <div class="col-md-4 fw-bold">CGPA</div>
            <div class="col-md-8">{{ student.cgpa }}</div>
        </div>

        <div class="row mb-2">
            <div class="col-md-4 fw-bold">Resume</div>
            <div class="col-md-8">

                {% if student.is_resume_uploaded %}
                    <span class="badge bg-success">Uploaded</span>
                {% else %}
                    <span class="badge bg-warning">Not Uploaded</span>
                {% endif %}

            </div>
        </div>

    </div>

</div>
